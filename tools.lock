# The build tools the Windows Hookshot Builder needs, which are not in Hookshot's releases: the builder's setup and the
# Hookshot Launcher download each one it lacks, check its SHA-256 and size, keep it in a download cache that every
# installed version shares, and unpack it into the install (docs/releases.md, "tools.lock"). A change is a pull request
# that edits this file; scripts/tools.py checks it, mirrors an upstream archive, and assembles and uploads ours
# (RELEASING.md, "Bump a tool"). The Linux builder carries its tools inside its AppImage (scripts/linux/deps.sh's pins).
#
#   tool <name> <version> <system> <sha256> <size> <dest> <prefix> <url> [<url> ...]
#
# dest: the folder the tool becomes in a builder install. prefix: the folder inside the archive that becomes dest ("-": the
# whole archive). The URLs are tried in order: first the copy in Hookshot's "tools" release
# (https://git.notrexed.dev/Hookshot/Hookshot/releases/download/tools/<sha256>-<name>.zip), then where it came from
# (upstream, or NotRexed/Hookshot's release) as the fallback. Archives Hookshot assembles (a tool with our packages, our
# profile) are only there. The tools release is filled before the first release (RELEASING.md, One-time setup).
#
# Taken as they are from Hookshot v2.1.0's Windows builder (NotRexed/Hookshot, release builder-parts), until
# Hookshot assembles its own: python, emsdk, cpm and wgpu-native.
